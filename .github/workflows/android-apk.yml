name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 36 & Build-Tools 36.0.0
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Clean any stale legacy source files
        run: |
          find app/src -name "*.java" -delete || true
          rm -rf app/src/main/java/com/tracalait/app/model \
                 app/src/main/java/com/tracalait/app/ui \
                 app/src/main/java/com/tracalait/app/viewmodel \
                 app/src/main/java/com/tracalait/app/data || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK and GitHub Pages Download Site
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TracaLait.apk
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/TracaLait.apk
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TraçaLait – Télécharger l'APK Android</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #1A3A5C; color: #fff; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; }
              .card { background: #fff; color: #1F2937; padding: 32px; border-radius: 12px; max-width: 420px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
              h1 { color: #1A3A5C; margin: 12px 0 8px; }
              p { color: #4B5563; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
              .btn { display: inline-block; background: #2563EB; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 8px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div style="font-size: 42px;">🥛</div>
              <h1>TraçaLait Android</h1>
              <p>Application de traçabilité des produits laitiers (Kotlin &amp; Jetpack Compose).</p>
              <a class="btn" href="TracaLait.apk" download>⬇ Télécharger TracaLait.apk</a>
            </div>
          </body>
          </html>
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TracaLait-APK
          path: TracaLait.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest TracaLait.apk --clobber
          else
            gh release create latest TracaLait.apk \
              --title "TraçaLait Android APK (Latest)" \
              --notes "Téléchargez et installez **TracaLait.apk** sur votre appareil Android."
          fi

      - name: Deploy APK Download Page to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
